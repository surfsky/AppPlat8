<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xmind embed debug</title>
  <link rel="stylesheet" href="/lib/jsmind/jsmind.css">
  <script src="/lib/jsmind/jsmind.js"></script>
  <script src="/lib/jszip/jszip.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #f1f5f9; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #mind { width: 100%; height: 100%; position: relative; background: #f8fafc; }
    #hint { position: absolute; top: 10px; left: 10px; z-index: 3; font-size: 12px; color: #334155; background: rgba(255,255,255,.92); border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 8px; }
    #error { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; color: #334155; font-size: 14px; background: #f8fafc; z-index: 5; }
    #log { position: fixed; top: 10px; right: 10px; width: 420px; max-height: 80vh; overflow: auto; background: rgba(255,255,255,.96); border: 1px solid #cbd5e1; padding: 8px; font: 12px/1.4 monospace; white-space: pre-wrap; z-index: 9; }
  </style>
</head>
<body>
  <div id="mind">
    <div id="hint">xmind embed debug</div>
    <div id="error"></div>
  </div>
  <pre id="log"></pre>
  <script>
    const hint = document.getElementById('hint');
    const err = document.getElementById('error');
    const logEl = document.getElementById('log');
    const name = 'sample.xmind';
    const fileUrl = '/Files/Samples/sample.xmind';

    function log(text) {
      logEl.textContent += text + '\n';
      console.log(text);
    }

    function showError(message) {
      err.textContent = message;
      err.style.display = 'flex';
      log('ERROR: ' + message);
    }

    function hideError() {
      err.style.display = 'none';
    }

    function parseXmindJsonTopic(topic, indexState) {
      const id = `xmind_json_${indexState.value++}`;
      const title = topic && topic.title ? topic.title : '节点';
      const children = [];
      const childGroup = (topic && topic.children) || {};
      const attached = Array.isArray(childGroup.attached) ? childGroup.attached : [];
      const detached = Array.isArray(childGroup.detached) ? childGroup.detached : [];
      const summary = Array.isArray(childGroup.summary) ? childGroup.summary : [];
      const allChildren = attached.concat(detached, summary);
      for (let i = 0; i < allChildren.length; i += 1) {
        const child = allChildren[i];
        if (!child || typeof child !== 'object') continue;
        children.push(parseXmindJsonTopic(child, indexState));
      }
      return { id, topic: title, children };
    }

    function parseXmindJsonText(contentText) {
      const raw = JSON.parse(contentText);
      const sheets = Array.isArray(raw) ? raw : [raw];
      const first = sheets.find((s) => s && s.rootTopic) || sheets[0];
      const rootTopic = first && first.rootTopic ? first.rootTopic : null;
      if (!rootTopic) throw new Error('xmind content.json 未找到 rootTopic');
      return parseXmindJsonTopic(rootTopic, { value: 1 });
    }

    function parseXmindXmlTopic(topicNode, indexState) {
      const id = `xmind_xml_${indexState.value++}`;
      const titleNode = topicNode.querySelector(':scope > title');
      const title = titleNode ? (titleNode.textContent || '').trim() : '节点';
      const children = [];
      const topicNodes = Array.from(topicNode.querySelectorAll(':scope > children > topics > topic'));
      for (let i = 0; i < topicNodes.length; i += 1) {
        children.push(parseXmindXmlTopic(topicNodes[i], indexState));
      }
      return { id, topic: title || '节点', children };
    }

    function parseXmindXmlText(contentText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(contentText, 'text/xml');
      const parseErr = doc.querySelector('parsererror');
      if (parseErr) throw new Error('xmind content.xml 解析失败');
      const rootTopic = doc.querySelector('sheet > topic');
      if (!rootTopic) throw new Error('xmind content.xml 未找到根 topic');
      return parseXmindXmlTopic(rootTopic, { value: 1 });
    }

    function renderJsMind(rootData) {
      const jm = new jsMind({
        container: 'mind',
        editable: false,
        theme: 'primary',
        view: {
          hmargin: 90,
          vmargin: 50,
          line_width: 2,
          line_color: '#93c5fd'
        }
      });
      jm.show({
        meta: { name, author: 'App', version: '1.0' },
        format: 'node_tree',
        data: rootData
      });
      log('jmnode count=' + document.querySelectorAll('jmnode').length);
    }

    async function renderXmind(arrayBuffer) {
      if (!window.JSZip) throw new Error('JSZip 组件不可用');
      const zip = await window.JSZip.loadAsync(arrayBuffer);
      const findByPattern = (pattern) => {
        const matched = zip.file(pattern);
        return Array.isArray(matched) && matched.length > 0 ? matched[0] : null;
      };
      const jsonEntry = findByPattern(/(^|\/)content\.json$/i);
      if (jsonEntry) {
        const text = await jsonEntry.async('text');
        const root = parseXmindJsonText(text);
        hideError();
        renderJsMind(root);
        return;
      }
      const xmlEntry = findByPattern(/(^|\/)content\.xml$/i);
      if (xmlEntry) {
        const text = await xmlEntry.async('text');
        const root = parseXmindXmlText(text);
        hideError();
        renderJsMind(root);
        return;
      }
      throw new Error('未找到 xmind 的 content.json 或 content.xml');
    }

    async function run() {
      hint.textContent = 'xmind embed debug · ' + name;
      try {
        const resp = await fetch(fileUrl, { credentials: 'same-origin' });
        log('fetch status=' + resp.status + ', type=' + (resp.headers.get('content-type') || ''));
        if (!resp.ok) throw new Error('文件请求失败');
        const buffer = await resp.arrayBuffer();
        log('buffer bytes=' + buffer.byteLength);
        await renderXmind(buffer);
      } catch (error) {
        showError(error && error.message ? error.message : String(error));
      }
    }

    window.addEventListener('error', (event) => log('window.error: ' + event.message));
    window.addEventListener('unhandledrejection', (event) => log('unhandledrejection: ' + (event.reason && event.reason.message ? event.reason.message : event.reason)));
    run();
  </script>
</body>
</html>
