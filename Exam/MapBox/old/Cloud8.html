<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Mapbox + 心知天气 HyperData（卫星云图 & 雷达图）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { overflow:hidden; }
        #map { width:100vw; height:100vh; }
        .ctrl {
            position:fixed; top:20px; left:20px;
            background:rgba(255, 255, 255, 0.9); padding:15px; border-radius:8px;
            box-shadow:0 2px 10px rgba(0,0,0,.2); z-index:999;
            font-family: sans-serif;
            width: 250px;
        }
        .ctrl h3 { margin-bottom: 10px; font-size: 16px; }
        .layer-item { margin-bottom: 12px; }
        .layer-item label { display:flex; align-items: center; cursor:pointer; font-size: 14px; }
        .layer-item input[type="checkbox"] { margin-right: 8px; }
        .layer-item input[type="range"] { width:100%; margin-top: 5px; }
        .info { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="ctrl">
        <h3>天气图层 (HyperData)</h3>
        
        <div class="layer-item">
            <label><input type="checkbox" id="radar" checked> 全国雷达拼图 (1km)</label>
            <input type="range" id="radarOpacity" min="0" max="100" value="80">
            <div id="radarTime" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="satellite"> 分钟级卫星云图 (FY-4)</label>
            <input type="range" id="satelliteOpacity" min="0" max="100" value="60">
            <div id="satelliteTime" class="info">加载中...</div>
        </div>
    </div>

    <script>
        // ---------------- 配置信息 ----------------
        const PUBLIC_KEY = "PnBhJj-BzAsKRVy5T"; 
        const PRIVATE_KEY = "S1CRO7gLhFElvFAk-"; 
        mapboxgl.accessToken = "YOUR_MAPBOX_TOKEN";
        // -----------------------------------------

        const map = new mapboxgl.Map({
            container: "map",
            style: "mapbox://styles/mapbox/light-v10", // 使用浅色底图
            center: [105, 35], // 中国中心
            zoom: 4,
            projection: "mercator"
        });
        map.addControl(new mapboxgl.NavigationControl());

        /**
         * 生成心知天气 V4 签名
         * 文档：https://seniverse.yuque.com/hyper_data/api_v4/nke5p8
         */
        function generateSignature(params, privateKey) {
            // 1. 字典升序排列参数
            const sortedKeys = Object.keys(params).sort();
            const queryString = sortedKeys
                .map(key => `${key}=${params[key]}`)
                .join('&');

            // 2. 使用 HMAC-SHA1 算法计算签名
            const hash = CryptoJS.HmacSHA1(queryString, privateKey);
            
            // 3. Base64 编码并进行 URLEncode
            const signature = CryptoJS.enc.Base64.stringify(hash);
            return encodeURIComponent(signature);
        }

        /**
         * 构建带签名的完整 URL
         */
        function buildSignedUrl(baseUrl, fields, locations = null) {
            const ts = Math.floor(Date.now() / 1000);
            const ttl = 1800;
            const params = {
                fields: fields,
                public_key: PUBLIC_KEY,
                ts: ts,
                ttl: ttl
            };
            if (locations) params.locations = locations;

            const sig = generateSignature(params, PRIVATE_KEY);
            
            // 构建查询字符串
            const sortedKeys = Object.keys(params).sort();
            const baseQuery = sortedKeys
                .map(key => `${key}=${encodeURIComponent(params[key])}`)
                .join('&');
            
            return `${baseUrl}?${baseQuery}&sig=${sig}`;
        }

        /**
         * 获取心知天气 HyperData 数据
         */
        async function fetchWeatherMetaData() {
            try {
                // 卫星云图元数据接口示例 (HyperData v4)
                // 注意：根据文档，fields 如果是多个用逗号隔开
                const url = buildSignedUrl("https://api.seniverse.com/v4", "satellite_fy4,radar_1km");
                console.log("Requesting metadata:", url);

                const response = await fetch(url);
                const result = await response.json();
                
                if (result && result.results) {
                    const data = result.results[0];
                    if (data.radar_1km) {
                        document.getElementById('radarTime').innerText = `更新时间: ${new Date(data.radar_1km.time_updated).toLocaleString()}`;
                    }
                    if (data.satellite_fy4) {
                        document.getElementById('satelliteTime').innerText = `更新时间: ${new Date(data.satellite_fy4.time_updated).toLocaleString()}`;
                    }
                } else if (result.status) {
                    console.error("API Error:", result.status, result.status_code);
                }
            } catch (error) {
                console.error("获取气象元数据失败:", error);
            }
        }

        /**
         * 更新雷达图层
         */
        async function updateRadarLayer() {
            // 瓦片 URL 同样需要签名
            const ts = Math.floor(Date.now() / 1000);
            const ttl = 1800;
            const params = {
                public_key: PUBLIC_KEY,
                ts: ts,
                ttl: ttl
            };
            const sig = generateSignature(params, PRIVATE_KEY);
            const query = `public_key=${PUBLIC_KEY}&ts=${ts}&ttl=${ttl}&sig=${sig}`;

            // 注意：瓦片路径中的 {z}/{x}/{y} 不参与签名计算，作为路径部分
            const radarUrl = `https://api.seniverse.com/v4/weather/grid/radar_1km/tile/{z}/{x}/{y}.png?${query}`;
            
            if (!map.getSource('radar-source')) {
                map.addSource('radar-source', {
                    type: 'raster',
                    tiles: [radarUrl],
                    tileSize: 256
                });
                map.addLayer({
                    id: 'radar-layer',
                    type: 'raster',
                    source: 'radar-source',
                    paint: { 'raster-opacity': 0.8 }
                });
            }
        }

        /**
         * 更新卫星图层
         */
        async function updateSatelliteLayer() {
            const ts = Math.floor(Date.now() / 1000);
            const ttl = 1800;
            const params = {
                public_key: PUBLIC_KEY,
                ts: ts,
                ttl: ttl
            };
            const sig = generateSignature(params, PRIVATE_KEY);
            const query = `public_key=${PUBLIC_KEY}&ts=${ts}&ttl=${ttl}&sig=${sig}`;

            const satelliteUrl = `https://api.seniverse.com/v4/weather/grid/satellite_fy4/tile/{z}/{x}/{y}.png?${query}`;

            if (!map.getSource('satellite-source')) {
                map.addSource('satellite-source', {
                    type: 'raster',
                    tiles: [satelliteUrl],
                    tileSize: 256
                });
                map.addLayer({
                    id: 'satellite-layer',
                    type: 'raster',
                    source: 'satellite-source',
                    layout: { 'visibility': 'none' },
                    paint: { 'raster-opacity': 0.6 }
                });
            }
        }

        map.on("load", () => {
            updateRadarLayer();
            updateSatelliteLayer();
            fetchWeatherMetaData();
            
            // 每6分钟自动刷新一次元数据和图层（如果瓦片服务端有缓存控制则会自动获取最新的）
            setInterval(() => {
                fetchWeatherMetaData();
            }, 6 * 60 * 1000);

            // ---- 事件绑定 ----
            document.getElementById("radar").addEventListener("change", e => {
                map.setLayoutProperty("radar-layer", "visibility", e.target.checked ? "visible" : "none");
            });
            document.getElementById("radarOpacity").addEventListener("input", e => {
                map.setPaintProperty("radar-layer", "raster-opacity", parseInt(e.target.value)/100);
            });

            document.getElementById("satellite").addEventListener("change", e => {
                map.setLayoutProperty("satellite-layer", "visibility", e.target.checked ? "visible" : "none");
            });
            document.getElementById("satelliteOpacity").addEventListener("input", e => {
                map.setPaintProperty("satellite-layer", "raster-opacity", parseInt(e.target.value)/100);
            });
        });
    </script>
</body>
</html>
