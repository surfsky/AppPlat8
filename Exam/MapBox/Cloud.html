<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud7 气象大屏（卫星/雷达/等压线/风流向/台风/潮汐）</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0b172a;
            color: #0f172a;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        .topbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            min-width: 360px;
            max-width: min(88vw, 920px);
            background: linear-gradient(135deg, rgba(14, 116, 144, 0.92), rgba(15, 23, 42, 0.92));
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 12px;
            padding: 10px 16px;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .topbar h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        .topbar .meta {
            font-size: 12px;
            color: #cbd5e1;
            text-align: right;
            line-height: 1.5;
        }

        .ctrl {
            position: fixed;
            top: 84px;
            left: 16px;
            width: 330px;
            max-height: calc(100vh - 100px);
            overflow: auto;
            background: rgba(248, 250, 252, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.25);
            padding: 14px;
            z-index: 1000;
        }

        .ctrl h3 {
            margin-bottom: 10px;
            font-size: 15px;
            color: #0f172a;
        }

        .ctrl-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .ctrl-header h3 {
            margin: 0;
        }

        .ctrl-toggle-btn {
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #0f172a;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .ctrl-handle {
            position: fixed;
            top: 84px;
            left: 16px;
            z-index: 1002;
            display: none;
            align-items: center;
            gap: 8px;
            border-radius: 999px;
            padding: 8px 12px;
            background: rgba(248, 250, 252, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
            cursor: pointer;
            user-select: none;
        }

        .ctrl-handle .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0ea5e9;
        }

        .layer-item {
            margin-bottom: 12px;
        }

        .layer-item label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
        }

        .layer-item input[type="checkbox"] {
            margin-right: 8px;
        }

        .info {
            font-size: 12px;
            color: #334155;
            margin-top: 5px;
            line-height: 1.45;
        }

        @media (max-width: 1020px) {
            .topbar {
                left: 12px;
                right: 12px;
                transform: none;
                max-width: none;
                min-width: auto;
            }

            .ctrl {
                top: 78px;
                left: 12px;
                width: calc(100vw - 24px);
                max-height: 44vh;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="topbar">
        <h1>Cloud7 气象可视化平台</h1>
        <div class="meta" id="globalMeta">初始化中...</div>
    </div>

    <div class="ctrl-handle" id="ctrlHandle" title="显示图层面板">
        <span class="dot"></span>
        <span>图层</span>
    </div>

    <div class="ctrl">
        <div class="ctrl-header">
            <h3>图层控制</h3>
            <button class="ctrl-toggle-btn" id="btnCtrlCollapse" type="button" title="隐藏图层面板">隐藏</button>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="radar"> 实时降水雷达图 (RainViewer)</label>
            <div id="radarTime" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="satelliteLive"> 近实时卫星云图 (RainViewer IR)</label>
            <div id="satelliteLiveTime" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="satellite"> 卫星云图兜底 (NASA GIBS)</label>
            <div id="satelliteTime" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="pressure"> 气压层（平滑等压线）</label>
            <div id="pressureInfo" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="adminBoundary"> 行政边界</label>
            <div id="adminBoundaryInfo" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="wind"> 气流动画层</label>
            <div id="windInfo" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="cityTemp"> 城市温度标签</label>
            <div id="cityTempInfo" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="latlonGrid"> 经纬度网格线</label>
            <div id="gridInfo" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="tidePanel"> 海况与潮汐面板</label>
            <div id="tidePanelInfo" class="info">加载中...</div>
        </div>

        <div class="layer-item">
            <label><input type="checkbox" id="typhoon"> 台风路径 (CMA历史)</label>
            <div id="typhoonInfo" class="info">加载中...</div>
        </div>
    </div>
    <!-- 用在底部中间显示一个地图zoom和经纬度的面板 -->
     <div id="lblInfo" style="position:fixed; bottom:10px; left:50%; transform:translateX(-50%);; z-index:1000; padding:4px; color:white"></div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
