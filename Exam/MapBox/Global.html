<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapbox 旋转地球</title>
  <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet'>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #map { width: 100vw; height: 100vh; background: #000; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    /************************************************************
     * MapBox fly control
     * examples:
     * const cities = [
     *   { name: '北京', coords: [116.4074, 39.9042] },
     *   { name: '纽约', coords: [-74.0060, 40.7128] },
     * ];
     * map.addControl(new FlyControl(cities), 'top-right');
    ************************************************************/
    class FlyControl {
      constructor(cities) {
        this._cities = cities;
        this._injectStyles();
      }

      // 内部封装 CSS 样式
      _injectStyles() {
        if (document.getElementById('fly-control-style')) return;
        const style = document.createElement('style');
        style.id = 'fly-control-style';
        style.textContent = `
          .fly-ctrl svg { color: #444; transition: color 0.3s; }
          .fly-ctrl:hover svg { color: #33b5e5; }
        `;
        document.head.appendChild(style);
      }

      onAdd(map) {
        this._map = map;
        this._container = document.createElement('div');
        this._container.className = 'mapboxgl-ctrl mapboxgl-ctrl-group';
        this._button = document.createElement('button');
        this._button.className = 'mapboxgl-ctrl-icon fly-ctrl';
        this._button.type = 'button';
        this._button.title = '飞行到随机城市';
        this._button.style.display = 'flex';
        this._button.style.alignItems = 'center';
        this._button.style.justifyContent = 'center';
        // 纸飞机图标
        this._button.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M21.5,2.1L2,11l6,3.1l11-9l-9,10l0.1,5.8l3.9-3.5L18.4,21l3.1-18.9L21.5,2.1z"/>
        </svg>`;
        
        this._button.onclick = () => {
          const city = this._cities[Math.floor(Math.random() * this._cities.length)];
          spinEnabled = false; // 飞行开始，暂时停止自转
          map.flyTo({
            center: city.coords,
            zoom: 9,
            duration: 4000,
            essential: true
          });
          // 飞行结束后恢复自转（如果缩放允许）
          map.once('moveend', () => {
            spinEnabled = true;
          });
        };
        this._container.appendChild(this._button);
        return this._container;
      }
      onRemove() {
        this._container.parentNode.removeChild(this._container);
        this._map = undefined;
      }
    }

    //------------------------------------------------------
    // 地图初始化
    //------------------------------------------------------
    // 城市数据
    const cities = [
      { name: '北京', coords: [116.4074, 39.9042] },
      { name: '上海', coords: [121.4737, 31.2304] },
      { name: '杭州', coords: [120.1551, 30.2741] },
      { name: '温州', coords: [120.6994, 27.9943] },
      { name: '郑州', coords: [113.6253, 34.7466] },
      { name: '武汉', coords: [114.3054, 30.5928] },
      { name: '重庆', coords: [106.5507, 29.5630] },
      { name: '纽约', coords: [-74.0060, 40.7128] },
      { name: '伦敦', coords: [-0.1278, 51.5074] },
      { name: '东京', coords: [139.6917, 35.6895] },
      { name: '巴黎', coords: [2.3522, 48.8566] },
      { name: '悉尼', coords: [151.2093, -33.8688] },
      { name: '迪拜', coords: [55.2708, 25.2048] },
      { name: '津巴布韦', coords: [31.0530, -17.8252] }, // 哈拉雷 (津巴布韦首都)
      { name: '里约热内卢', coords: [-43.1729, -22.9068] }
    ];

    // 地图初始化
    mapboxgl.accessToken = 'YOUR_MAPBOX_TOKEN';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/satellite-v9', // 卫星底图
      center: [116.4, 39.9], // 默认北京
      zoom: 2,
      projection: 'globe'
    });

    // controls
    map.addControl(new mapboxgl.NavigationControl());
    map.addControl(new mapboxgl.FullscreenControl());
    map.addControl(new FlyControl(cities), 'top-right');

    // 在地图上显示城市 Marker
     cities.forEach(city => {
       const marker = new mapboxgl.Marker({ color: '#33b5e5' })
         .setLngLat(city.coords)
         .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(`<h4>${city.name}</h4>`))
         .addTo(map);

       // 为 Marker DOM 元素添加点击事件
       marker.getElement().style.cursor = 'pointer';
       marker.getElement().addEventListener('click', () => {
         spinEnabled = false; // 停止自转
         map.flyTo({
           center: city.coords,
           zoom: 9,
           duration: 3000,
           essential: true
         });
         // 飞行结束后恢复自转
         map.once('moveend', () => {
           spinEnabled = true;
         });
       });
     });

    //------------------------------------------------------
    // 旋转动画
    //------------------------------------------------------
    let userInteracting = false;
    let spinEnabled = true;
    const secondsPerRevolution = 120; // 完整旋转一周所需秒数
    const maxSpinZoom = 5; // 超过此缩放级别停止旋转
    const slowSpinZoom = 3; // 开始减速的缩放级别

    // 平滑旋转地球
    function rotateGlobe() {
      const zoom = map.getZoom();
      if (spinEnabled && !userInteracting && zoom < maxSpinZoom) {
        let distancePerSecond = 360 / secondsPerRevolution;
        if (zoom > slowSpinZoom) {
          // 缩放越大，旋转越慢
          const zoomDif = (maxSpinZoom - zoom) / (maxSpinZoom - slowSpinZoom);
          distancePerSecond *= zoomDif;
        }
        const center = map.getCenter();
        center.lng -= distancePerSecond / 60; // 假设 60fps
        map.setCenter(center);
      }
      requestAnimationFrame(rotateGlobe);
    }

    // 交互处理
    map.on('mousedown', () => { userInteracting = true; });
    map.on('mouseup', () => { userInteracting = false; });
    map.on('dragstart', () => { userInteracting = true; });
    map.on('dragend', () => { userInteracting = false; });
    map.on('zoomstart', () => { userInteracting = true; });
    map.on('zoomend', () => { userInteracting = false; });
    map.on('rotatebackstart', () => { userInteracting = true; });
    map.on('rotatebackend', () => { userInteracting = false; });

    //------------------------------------------------------
    // 初始启动旋转
    //------------------------------------------------------
    map.on('load', () => {
      // 设置大气层/雾效，配合黑色背景
      map.setFog({
        'range': [0.5, 10],
        'color': '#000000',
        'horizon-blend': 0.1,
        'high-color': '#000000',
        'space-color': '#000000',
        'star-intensity': 1.1  // 星星强度
      });

      rotateGlobe();
    });
  </script>
</body>
</html>
